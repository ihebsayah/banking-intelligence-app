services:

  # ============================================================================
  # FRONTEND DASHBOARD
  # ============================================================================

  frontend:
    container_name: banking_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # API GATEWAY & AUTHENTICATION
  # ============================================================================

  api-gateway:
    container_name: banking_api_gateway
    build:
      context: ./services/api_gateway
    working_dir: /app
    volumes:
      - ./services/api_gateway:/app
      - ./services/shared:/app/shared
      - ./init:/app/init
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - AUDIT_DATABASE_URL=postgresql://${POSTGRES_AUDIT_USER:-audit_user}:${POSTGRES_AUDIT_PASSWORD:-securepass123}@postgres-audit:5432/${POSTGRES_AUDIT_DB:-audit_logs}
      - REDIS_URL=redis://redis:6379/0
      - AUDIT_AGENT_URL=http://audit-agent:8008
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ============================================================================
  # ORCHESTRATOR AGENT (Master Agent)
  # ============================================================================

  orchestrator-agent:
    container_name: banking_orchestrator
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/orchestrator:/app
      - ./services/shared:/app/shared
      - ./services/debugging:/app/debugging
    ports:
      - "8001:8001"
    environment:
      - MISTRAL_API_URL=${MISTRAL_API_URL:-http://ollama:11434}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral}
      - ORCHESTRATOR_LLM=${ORCHESTRATOR_LLM:-mistral}
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - REDIS_URL=redis://redis:6379/1
      - INTENT_AGENT_URL=http://intent-agent:8002
      - SCHEMA_AGENT_URL=http://schema-agent:8003
      - ENTITY_RESOLUTION_AGENT_URL=http://entity-resolution-agent:8004
      - SQL_AGENT_URL=http://sql-agent:8005
      - VALIDATION_AGENT_URL=http://validation-agent:8006
      - EXECUTION_AGENT_URL=http://execution-agent:8007
      - AUDIT_AGENT_URL=http://audit-agent:8008
      - INSIGHTS_AGENT_URL=http://insights-agent:8013
      - COMPLIANCE_AGENT_URL=http://compliance-agent:8011
      - QUERY_SIGNING_KEY=${QUERY_SIGNING_KEY:-CHANGE_IN_PRODUCTION}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres-main
      - redis
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -r requirements.txt && python main.py"

  debug-service:
    container_name: banking_debug_service
    image: python:3.11-slim
    working_dir: /app
    # NOTE: debug-service intentionally has no restart policy — dev tool only
    volumes:
      - ./services/debugging:/app
    ports:
      - "8099:8099"
    environment:
      - LOG_LEVEL=DEBUG
      - IS_DEBUG_SERVICE=true
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8099/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      bash -c "pip install fastapi uvicorn websockets requests && python main.py"


  # ============================================================================
  # MICROSERVICE AGENTS
  # ============================================================================

  intent-agent:
    container_name: banking_intent_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/intent_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8002:8002"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -r requirements.txt && pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1.tar.gz && uvicorn main:app --host 0.0.0.0 --port 8002"

  schema-agent:
    container_name: banking_schema_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/schema_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8003:8003"
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8009
      - REDIS_URL=redis://redis:6379/2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8003"

  entity-resolution-agent:
    container_name: banking_entity_resolution
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/entity_resolution_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8004:8004"
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8009
      - POSTGRES_EMBEDDINGS_URL=postgresql://${POSTGRES_EMBEDDINGS_USER:-embedding_user}:${POSTGRES_EMBEDDINGS_PASSWORD:-securepass123}@postgres-embeddings:5432/${POSTGRES_EMBEDDINGS_DB:-embeddings}
      - REDIS_URL=redis://redis:6379/3
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres-embeddings
      - redis
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8004"

  sql-agent:
    container_name: banking_sql_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/sql_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8005:8005"
    environment:
      - REDIS_URL=redis://redis:6379/4
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8005"

  validation-agent:
    container_name: banking_validation_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/validation_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8006:8006"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8006"

  execution-agent:
    container_name: banking_execution_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/execution_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - REDIS_URL=redis://redis:6379/5
      - QUERY_SIGNING_KEY=${QUERY_SIGNING_KEY:-CHANGE_IN_PRODUCTION}
      - AUDIT_SERVICE_URL=http://audit-agent:8008
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres-main
      - redis
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8007"

  audit-agent:
    container_name: banking_audit_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/audit_agent:/app
      - ./services/shared:/app/shared
    ports:
      - "8008:8008"
    environment:
      - AUDIT_DATABASE_URL=postgresql://${POSTGRES_AUDIT_USER:-audit_user}:${POSTGRES_AUDIT_PASSWORD:-securepass123}@postgres-audit:5432/${POSTGRES_AUDIT_DB:-audit_logs}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-audit:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8008 --reload"

  # ============================================================================
  # SUPPORTING SERVICES
  # ============================================================================

  embedding-service:
    container_name: banking_embedding_service
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/embedding_service:/app
      - ./services/shared:/app/shared
    ports:
      - "8009:8009"
    environment:
      - POSTGRES_EMBEDDINGS_URL=postgresql://${POSTGRES_EMBEDDINGS_USER:-embedding_user}:${POSTGRES_EMBEDDINGS_PASSWORD:-securepass123}@postgres-embeddings:5432/${POSTGRES_EMBEDDINGS_DB:-embeddings}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-embeddings:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      bash -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8009"

  secrets-manager:
    container_name: banking_secrets
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/secrets_manager:/app
      - banking_secrets_volume:/secrets
    ports:
      - "8010:8010"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      bash -c "pip install -r requirements.txt && python main.py"

  # ============================================================================
  # PHASE 2: INSIGHTS, COMPLIANCE & AUDIT ENHANCEMENT
  # ============================================================================

  insights-agent:
    container_name: banking_insights_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/insights_agent:/app
    ports:
      - "8013:8013"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - MISTRAL_API_URL=${MISTRAL_API_URL:-http://ollama:11434}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres-main
      - ollama
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8013/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8013 --reload"

  compliance-agent:
    container_name: banking_compliance_agent
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/compliance_agent:/app
    ports:
      - "8011:8011"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-main:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8011/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8011 --reload"

  audit-enhancement:
    container_name: banking_audit_enhancement
    image: python:3.11-slim
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./services/audit_enhancement:/app
    ports:
      - "8012:8012"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_MAIN_USER:-banking_user}:${POSTGRES_MAIN_PASSWORD:-securepass123}@postgres-main:5432/${POSTGRES_MAIN_DB:-banking_dev}
      - AUDIT_DATABASE_URL=postgresql://${POSTGRES_AUDIT_USER:-audit_user}:${POSTGRES_AUDIT_PASSWORD:-securepass123}@postgres-audit:5432/${POSTGRES_AUDIT_DB:-audit_logs}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-audit:
        condition: service_healthy
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    command: >
      bash -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8012 --reload"

  # ============================================================================
  # DATABASES
  # ============================================================================

  postgres-main:
    container_name: banking_postgres_main
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB:-banking_dev}
      POSTGRES_USER: ${POSTGRES_MAIN_USER:-banking_user}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD:-securepass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./init/postgres-main-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MAIN_USER:-banking_user} -d ${POSTGRES_MAIN_DB:-banking_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-audit:
    container_name: banking_postgres_audit
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUDIT_DB:-audit_logs}
      POSTGRES_USER: ${POSTGRES_AUDIT_USER:-audit_user}
      POSTGRES_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:-securepass123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_audit_data:/var/lib/postgresql/data
      - ./init/postgres-audit-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUDIT_USER:-audit_user} -d ${POSTGRES_AUDIT_DB:-audit_logs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-embeddings:
    container_name: banking_postgres_embeddings
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_EMBEDDINGS_DB:-embeddings}
      POSTGRES_USER: ${POSTGRES_EMBEDDINGS_USER:-embedding_user}
      POSTGRES_PASSWORD: ${POSTGRES_EMBEDDINGS_PASSWORD:-securepass123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_embeddings_data:/var/lib/postgresql/data
      - ./init/postgres-embeddings-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EMBEDDINGS_USER:-embedding_user} -d ${POSTGRES_EMBEDDINGS_DB:-embeddings}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CACHING & SESSIONS
  # ============================================================================

  redis:
    container_name: banking_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - banking-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # LOCAL LLM (FALLBACK)
  # ============================================================================

  ollama:
    container_name: banking_ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - banking-network
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: serve

volumes:
  postgres_main_data:
  postgres_audit_data:
  postgres_embeddings_data:
  redis_data:
  ollama_data:
  banking_secrets_volume:

networks:
  banking-network:
    driver: bridge
